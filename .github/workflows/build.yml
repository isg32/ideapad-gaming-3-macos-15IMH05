name: build-efi

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned components
        run: bash scripts/fetch-components.sh

      - name: Assemble EFI + ocvalidate
        run: |
          python3 scripts/build-efi.py
          "$GITHUB_WORKSPACE/build/downloads/oc-rel/Utilities/ocvalidate/ocvalidate.linux" EFI/OC/config.plist

      - name: Package
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -r "EFI-IdeaPad-Gaming-3-15IMH05-${GITHUB_REF_NAME}.zip" EFI docs/RUNBOOK.md docs/COMPONENTS.md

      - uses: actions/upload-artifact@v4
        with:
          name: EFI-${{ github.ref_name }}
          path: EFI-IdeaPad-Gaming-3-15IMH05-*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EFI-IdeaPad-Gaming-3-15IMH05-*.zip
