name: build-efi

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed for softprops/action-gh-release to create/update the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned components
        run: bash scripts/fetch-components.sh

      - name: Assemble EFI + ocvalidate
        run: |
          python3 scripts/build-efi.py
          "$GITHUB_WORKSPACE/build/downloads/oc-rel/Utilities/ocvalidate/ocvalidate.linux" EFI/OC/config.plist

      - name: Package
        id: pkg
        run: |
          cd "$GITHUB_WORKSPACE"
          name="EFI-IdeaPad-Gaming-3-15IMH05-${GITHUB_REF_NAME//\//-}.zip"
          zip -r "$name" EFI docs/RUNBOOK.md docs/COMPONENTS.md docs/HARDWARE.md
          echo "zip=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: EFI-${{ github.ref_name }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.pkg.outputs.zip }}
          fail_on_unmatched_files: true
          generate_release_notes: true
